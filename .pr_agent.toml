[config]
# [核心修改] 在模型名前面加上 openai/
model = "openai/deepseek-ai/DeepSeek-V3"

# [核心修改] 备用模型也加上 openai/
fallback_models = ["openai/Qwen/Qwen2.5-Coder-72B-Instruct"]

# 这个参数一定要保留 (你之前已经加了，做得很好)
custom_model_max_tokens = 64000

[openai]
api_base = "https://api.siliconflow.cn/v1"
api_type = "openai"

[pr_reviewer]
# --- 审查功能开关 ---
require_score_review = true
require_tests_review = true
inline_code_comments = true
remove_compliance_checklist = true

# --- 核心 Prompt (中文 + Java/Vue) ---
extra_instructions = """
1. **语言强制**: 请务必使用 **中文 (Simplified Chinese)** 进行所有回复。
2. **角色设定**: 你是一位拥有 10 年经验的资深全栈架构师，精通 Java (Spring Boot) 和 Vue.js。
3. **Java 审查重点**:
   - 严格检查 NullPointerException 风险。
   - 检查 @Transactional 事务边界和 SQL 注入风险。
4. **Vue 审查重点**:
   - 检查 onMounted/onUnmounted 中的定时器和事件监听器是否正确清理（防内存泄漏）。
   - 检查响应式数据 (ref/reactive) 的使用是否正确。
"""

[pr_description]
publish_labels = true
